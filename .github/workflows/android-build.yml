name: Desi Calculator AI PRO V2.0 - Android Debug & Release APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build Release APK (uses keystore secrets if configured)'
        required: false
        default: 'true'
        type: boolean
      publish_release:
        description: 'Publish APK(s) to GitHub Releases'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  test-and-build-debug:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          java -version
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | sed -n 's/.*version "\([^"]*\)".*/\1/p' | cut -d. -f1)
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java 17+ is required."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare temporary debug keystore
        run: |
          set -euo pipefail
          if [ ! -f "./debug.keystore" ]; then
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi

      - name: Run unit and Robolectric tests
        id: run_tests
        run: |
          set -euo pipefail
          mkdir -p build-logs
          gradle :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee build-logs/unit-tests.log

      - name: Build Debug APK
        id: build_debug_apk
        run: |
          set -euo pipefail
          mkdir -p build-logs
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build-logs/assemble-debug.log

      - name: Verify Debug APK exists and is non-empty
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::Expected Debug APK missing or empty at $APK_PATH"
            exit 1
          fi
          echo "Verified Debug APK: $APK_PATH ($(wc -c < "$APK_PATH") bytes)"

      - name: Upload Build Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-logs
          path: |
            build-logs/
            **/build/test-results/
            **/build/reports/tests/
          if-no-files-found: warn

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desi-calculator-ai-pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Debug APK to GitHub Releases (when requested)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-v2.0.0-build-${GITHUB_RUN_NUMBER}"
          RELEASE_TITLE="Desi Calculator AI PRO V2.0 Debug #${GITHUB_RUN_NUMBER}"
          gh release create "$RELEASE_TAG" "app/build/outputs/apk/debug/app-debug.apk" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "Automated Debug APK build from commit ${GITHUB_SHA}." \
            --latest

  build-release-apk:
    name: Build Release APK
    needs: test-and-build-debug
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_release == true) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Release Signing Keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > ./my-upload-key.jks
            echo "RELEASE_SIGNED=true" >> "$GITHUB_ENV"
          else
            # Generate an ephemeral CI release keystore when repository secrets are not set
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore ./my-upload-key.jks \
              -storepass "${{ secrets.STORE_PASSWORD || 'desicalcci123' }}" \
              -alias upload \
              -keypass "${{ secrets.KEY_PASSWORD || 'desicalcci123' }}" \
              -dname "CN=Hardik Kumar,O=Desi Calculator,C=IN" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
            echo "RELEASE_SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Assemble Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'desicalcci123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'desicalcci123' }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify Release APK
        run: |
          set -euo pipefail
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ] || [ ! -s "$RELEASE_APK" ]; then
            echo "::error::Release APK not produced."
            exit 1
          fi
          echo "Verified Release APK: $RELEASE_APK ($(wc -c < "$RELEASE_APK") bytes)"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desi-calculator-ai-pro-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
