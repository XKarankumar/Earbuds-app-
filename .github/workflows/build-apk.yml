name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          java -version
          JAVA_VER_RAW=$(java -version 2>&1 | head -n 1 | sed -n 's/.*version "\([^"]*\)".*/\1/p')
          if [ -z "$JAVA_VER_RAW" ]; then
            echo "::error::Failed to detect active Java version."
            exit 1
          fi
          if [[ "$JAVA_VER_RAW" == 1.* ]]; then
            JAVA_MAJOR=$(echo "$JAVA_VER_RAW" | cut -d. -f2)
          else
            JAVA_MAJOR=$(echo "$JAVA_VER_RAW" | cut -d. -f1)
          fi
          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse Java major version from: $JAVA_VER_RAW"
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $JAVA_MAJOR."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          if [ -f "./debug.keystore" ]; then
            echo "Existing debug.keystore detected."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              echo "::error::keytool not found in configured JAVA_HOME ($JAVA_HOME)."
              exit 1
            fi
            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1 || {
                echo "::error::Failed to create temporary debug.keystore."
                exit 1
              }
          fi
          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::./debug.keystore is missing or empty after generation."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected debug APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK paths discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ] || [[ "$APK_PATH" != *.apk ]] || [ "$APK_PATH" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Verified debug APK check failed for $APK_PATH"
            exit 1
          fi
          echo "Verified debug APK: $APK_PATH ($(wc -c < "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        run: |
          set -euo pipefail
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SRC_APK" ] || [ ! -s "$SRC_APK" ]; then
            echo "::error::Verified debug APK is missing or empty at $SRC_APK"
            exit 1
          fi
          RAW_REPO="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO=$(printf '%s' "$RAW_REPO" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="android-app"
          fi
          ASSET_FILENAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TMP_DIR=$(mktemp -d "${RUNNER_TEMP}/release-asset-XXXXXX")
          ASSET_PATH="${TMP_DIR}/${ASSET_FILENAME}"
          cp "$SRC_APK" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Failed to prepare release APK asset at $ASSET_PATH"
            exit 1
          fi
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_filename=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_FILENAME: ${{ steps.prepare_release_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail
          gh --version
          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset validation failed: ${ASSET_PATH:-<empty>}"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE=$(mktemp "${RUNNER_TEMP}/release-notes-XXXXXX.md")
          cat <<EOF > "$NOTES_FILE"
          This is an automatically generated debug APK built by GitHub Actions.

          - **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}
          - **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Asset Filename:** ${ASSET_FILENAME}

          **Important Notes:**
          - This APK is intended for testing only.
          - This APK is **not** a Play Store production release.
          - This APK is signed only with a temporary debug keystore.
          EOF

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_artifact.outcome }}
          ASSET_FILENAME: ${{ steps.prepare_release_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url')
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "GitHub Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_FILENAME"
            {
              echo "## Debug APK Published"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **APK Asset Filename:** \`$ASSET_FILENAME\`"
              echo "- **Release Page:** $RELEASE_URL"
              echo ""
              echo "You can download the APK directly from the **Assets** section on the GitHub Release page above."
              echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available on this workflow run as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$UPLOAD_OUTCOME" = "success" ]; then
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            echo "APK build succeeded."
            echo "Backup artifact available: app-debug-apk"
            {
              echo "## Debug APK Build Succeeded (Release Publishing Warning)"
              echo ""
              echo "> **Warning:** Publishing to GitHub Releases failed, but the debug APK build itself succeeded."
              echo ""
              echo "- The normal GitHub Actions artifact named \`app-debug-apk\` remains available for download on this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::APK build or artifact upload did not succeed (upload outcome: $UPLOAD_OUTCOME, release outcome: $RELEASE_OUTCOME)."
            {
              echo "## Debug APK Build Failed"
              echo ""
              echo "The debug APK build or artifact upload did not complete successfully."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
